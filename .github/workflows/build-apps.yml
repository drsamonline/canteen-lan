# Test + build + release + deploy. One push, one pipeline, all from the same commit.
#
# SPDX-FileCopyrightText: 2026 Dr Sohil Momin
# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
#
# The build itself lives in the public app-builder kit, so a fix there reaches
# every app at once. It used to be a 4.9 kB hand-copied workflow, and the copies
# drifted — one kept `if: always()` on the release job, which DELETED the
# published release before recreating it, so a failed build destroyed the release.
# Do not inline it again.
#
# What runs here:
#   test  -> node test-node.js. The suite is the only thing standing between a
#            missing script and a dead page (1.1.0 shipped exactly that), so the
#            build does not start until it is green.
#   app   -> the portable EXE and the signed APK -> the rolling `app-latest`
#            release -> the demo deployed to Pages. All from the same commit.
#   icon  -> the app icon, attached to the release. A release page with three
#            bare filenames and no mark is a release nobody recognises.
#
# Pull requests build (and are therefore checked) but never release or deploy.

name: Build + deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  test:
    name: The engine, the host and the page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: node test-node.js
        run: node test-node.js
      - name: node scripts/smoke-host.js
        run: node scripts/smoke-host.js
      - name: node scripts/link-check.js
        run: node scripts/link-check.js

  app:
    needs: test
    uses: drsamonline/app-builder/.github/workflows/build.yml@49c2e0b172890f9334bbc7167a0e7fb5cd3756ba   # was @main
    with:
      app_name: canteen-lan
      app_src: docs/play
      deploy_path: docs
    permissions:
      contents: write
      pages: write
      actions: write    # the shot job dispatches the run that publishes its picture
      id-token: write

  icon:
    name: Attach the app icon to the release
    needs: app
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: gh release upload + notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # `file#label` sets the asset's LABEL, not its name, so copy it first
          cp docs/icon.png canteen-lan-icon.png
          gh release upload app-latest canteen-lan-icon.png --clobber -R "$REPO"
          gh release delete-asset app-latest icon.png --yes -R "$REPO" || true
          # the mark in the release notes, so the page is recognisable at a glance
          {
            echo "Rolling build of **Canteen LAN** — order from your table over the room's own Wi-Fi."
            echo
            echo "![Canteen LAN](https://raw.githubusercontent.com/$REPO/main/docs/icon.png)"
            echo
            echo "One commit, one release: the APK, the portable EXE and the Linux binary below all come from the same commit as the live demo. Offline, no accounts, no runtime dependency."
          } > "$RUNNER_TEMP/notes.md"
          gh release edit app-latest -R "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
