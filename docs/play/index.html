<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canteen — order from your table</title>
<meta name="description" content="Order from your table over the room's own Wi-Fi. No accounts, no internet, no telemetry.">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0f1115;--card:#171a21;--ink:#e7e9ee;--mut:#9aa3b2;--line:#252a34;--acc:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header,main,footer{max-width:900px;margin:0 auto;padding:16px 20px}
  header{border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  h1{font-size:20px;margin:0}
  h1 span{color:var(--mut);font-weight:400;font-size:14px}
  h2{font-size:15px;margin:22px 0 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .grow{flex:1}
  button,select,input,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  button{cursor:pointer}
  button.primary{background:var(--acc);color:#06210f;border-color:var(--acc);font-weight:700}
  button.sm{padding:6px 11px;font-size:13px;min-height:34px}
  button.ghost{background:transparent}
  button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .item{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .item b{font-weight:600;font-size:14px}
  .item small{color:var(--mut)}
  .qty{display:flex;align-items:center;gap:6px}
  .qty button{width:34px;text-align:center;padding:5px 0;min-height:34px}
  .mut{color:var(--mut)}
  .pill{display:inline-block;font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line)}
  .s-placed{color:var(--warn);border-color:var(--warn)}
  .s-preparing{color:var(--info);border-color:var(--info)}
  .s-served{color:var(--acc);border-color:var(--acc)}
  .s-cancelled{color:var(--bad);border-color:var(--bad);text-decoration:line-through}
  .tag{font-size:11px;border-radius:999px;padding:1px 7px;border:1px solid var(--line);color:var(--mut);margin-right:4px}
  .tag.on{color:var(--acc);border-color:var(--acc)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
  .dot.on{background:var(--acc)}
  .dot.warn{background:var(--warn)}
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
  .stats .card b{display:block;font-size:22px}
  .line{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .line:last-child{border-bottom:0}
  .table-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 6px;flex-wrap:wrap}
  .order{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}
  .order .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .empty{color:var(--mut);font-style:italic}
  .sold{opacity:.55}
  .sold b{text-decoration:line-through}
  footer{color:var(--mut);font-size:13px;border-top:1px solid var(--line);margin-top:30px}
  [hidden]{display:none!important}
  .demobar{max-width:900px;margin:12px auto 0;padding:9px 14px;border:1px dashed var(--warn);border-radius:10px;
    color:var(--warn);font-size:13px;line-height:1.5}
  .demobar.off{border-color:var(--info);color:var(--info)}
  label{font-size:13px;color:var(--mut);display:block;margin-bottom:3px}
  #join .row>div{min-width:0}
  #join input{width:100%}
  .tabs button{border-radius:999px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .mi{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
  .mi:last-child{border-bottom:0}
  .mi .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  @media(max-width:620px){.mi{grid-template-columns:1fr;gap:6px}.mi .acts{justify-content:flex-start}}
  .form{display:grid;grid-template-columns:1.4fr .7fr .7fr .6fr;gap:8px;align-items:end}
  @media(max-width:620px){.form{grid-template-columns:1fr}}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tags button{font-size:12px;padding:5px 10px;border-radius:999px;background:transparent;color:var(--mut)}
  .tags button.on{color:var(--acc);border-color:var(--acc)}
  .opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
  .opt{font-size:11.5px;padding:4px 9px;border-radius:999px;background:transparent;
       color:var(--mut);border:1px solid var(--line);min-height:28px}
  .opt.on{color:var(--acc);border-color:var(--acc)}
  .floor{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;margin-bottom:6px}
  .tile{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;
        background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer}
  .tile b{font-size:19px}
  .tile span{font-size:13px;color:var(--ink)}
  .tile small{font-size:11.5px;color:var(--mut)}
  .tile em{font-style:normal;font-size:11.5px;color:var(--warn)}
  .tile.on{border-color:var(--acc)}
  .tile.call{border-color:var(--warn)}
  .slipcard{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
  @media(max-width:520px){.slipcard{grid-template-columns:1fr}}
  .slipqr{background:#fff;padding:8px;border-radius:8px;line-height:0}
  .slipqr svg{width:132px;height:132px;display:block}
  .slipbody{min-width:0}
  .slipbody small{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;word-break:break-all}
</style>
</head>
<body>
<header>
  <h1>Canteen <span id="tag"></span></h1>
  <div class="row">
    <span id="status" class="mut"><span class="dot"></span> <span id="statusText"></span></span>
    <button id="sound" class="ghost sm" title="Alert sound" aria-pressed="false">♪</button>
    <button id="theme" class="ghost sm" title="Theme">◐</button>
    <button id="viewBtn" class="sm">Kitchen</button>
  </div>
</header>

<div id="demoBar" class="demobar" hidden></div>

<main>
  <section id="join">
    <h2 id="joinH"></h2>
    <div class="card">
      <div class="row">
        <div class="grow"><label id="lName"></label><input id="name" placeholder="Aarti" autocomplete="name"></div>
        <div style="width:110px"><label id="lTable"></label><input id="table" placeholder="12" inputmode="numeric"></div>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="grow"><label id="lHost"></label><input id="host" placeholder="http://192.168.1.20:8080" inputmode="url"></div>
        <div style="width:110px"><label id="lPin"></label><input id="pin" placeholder="—" inputmode="numeric" autocomplete="off"></div>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="joinBtn" class="primary"></button>
        <button id="soloBtn" class="ghost sm"></button>
        <span id="joinMsg" class="mut"></span>
      </div>
      <p class="mut" style="font-size:12.5px;margin:10px 0 0" id="joinHint"></p>
    </div>
  </section>

  <section id="app" hidden>
    <div id="guest">
      <div class="row" style="margin:4px 0 6px">
        <input id="search" class="grow" placeholder="" aria-label="Search the menu">
      </div>
      <div class="tags" id="filters"></div>

      <h2 id="hMenu"></h2>
      <div id="offHours" class="mut" style="font-size:12.5px;margin:0 0 8px" hidden></div>
      <div id="menu" class="grid"></div>

      <h2 id="hCart"></h2>
      <div class="card">
        <div id="cart"></div>
        <div class="row" style="margin-top:10px">
          <input id="note" class="grow" placeholder="">
          <button id="placeBtn" class="primary"></button>
        </div>
      </div>

      <h2 id="hMine"></h2>
      <div id="mine"></div>
      <div class="row" style="margin-top:10px">
        <button id="waiterBtn"></button>
        <button id="billBtn"></button>
        <button id="slipBtn" class="ghost"></button>
      </div>
      <div id="slip" hidden></div>
    </div>

    <div id="kitchen" hidden>
      <h2 id="hKitchen"></h2>
      <div id="kstats" class="stats"></div>

      <div class="row tabs" style="margin-top:14px">
        <button id="tabOrders" class="primary sm"></button>
        <button id="tabCalls" class="ghost sm"></button>
        <button id="tabFloor" class="ghost sm"></button>
        <button id="tabMenu" class="ghost sm"></button>
        <button id="tabReport" class="ghost sm"></button>
      </div>

      <div id="korders" style="margin-top:8px">
        <div class="row" style="margin-bottom:6px">
          <button id="undoBtn" class="sm ghost"></button>
          <span class="grow"></span>
          <button id="exportBtn" class="sm"></button>
          <button id="clearBtn" class="sm"></button>
        </div>
        <div id="klist"></div>
      </div>

      <div id="kcalls" style="margin-top:8px" hidden></div>

      <div id="kfloor" style="margin-top:8px" hidden></div>

      <div id="kmenu" style="margin-top:8px" hidden>
        <div class="card" style="margin-bottom:12px">
          <div class="form">
            <div><label id="lItemName"></label><input id="miName" placeholder="Poha"></div>
            <div><label id="lItemPrice"></label><input id="miPrice" placeholder="35" inputmode="decimal"></div>
            <div><label id="lItemSku"></label><input id="miSku" placeholder="poha"></div>
            <div><label id="lItemStock"></label><input id="miStock" placeholder="—" inputmode="numeric"></div>
          </div>
          <div class="form" style="margin-top:10px">
            <div><label id="lItemFrom"></label><input id="miFrom" placeholder="—" inputmode="numeric"></div>
            <div><label id="lItemTo"></label><input id="miTo" placeholder="—" inputmode="numeric"></div>
            <div><label id="lItemOpts"></label><input id="miOpts" placeholder="Extra chutney:10, No sugar:0"></div>
            <div></div>
          </div>
          <div class="tags" id="miTags" style="margin-top:10px"></div>
          <p class="mut" style="font-size:12.5px;margin:0 0 8px" id="miHint"></p>
          <div class="row" style="margin-top:10px">
            <button id="miSave" class="primary sm"></button>
            <button id="miReset" class="ghost sm"></button>
            <button id="boardBtn" class="ghost sm"></button>
            <span id="miMsg" class="mut" style="font-size:12.5px"></span>
          </div>
        </div>
        <div class="card" id="miList"></div>
      </div>

      <div id="kreport" style="margin-top:8px" hidden>
        <div class="card" id="reportBody"></div>
        <div class="row" style="margin-top:10px">
          <button id="printReport" class="sm"></button>
          <button id="printA4" class="sm ghost"></button>
          <button id="boardBtn2" class="sm ghost"></button>
        </div>
        <div class="row" style="margin-top:8px">
          <button id="backupBtn" class="sm ghost"></button>
          <button id="restoreBtn" class="sm ghost"></button>
          <input id="restoreFile" type="file" accept=".jsonl,.json,.txt,application/json,text/plain" hidden>
        </div>
        <p class="mut" id="backupMsg" style="font-size:12.5px;margin:8px 0 0"></p>
      </div>
    </div>
  </section>
</main>

<footer class="mut">
  Built with Forge · web-kit + lan-kit · offline, no accounts · © 2026 Dr Sohil Momin
  · <span id="build"></span>
</footer>

<div class="sr" id="live" role="status" aria-live="polite"></div>
<div id="printArea"></div>

<script src="web-kit.js"></script>
<script src="lan-kit.js"></script>
<script src="qr.js"></script>
<script src="canteen.js"></script>
<script>
(function () {
  "use strict";
  var C = Canteen, L = Loom;
  var $ = function (id) { return document.getElementById(id); };

  /* ---- app strings, on top of web-kit's built-ins ---- */
  var S = {
    en: { tag: "order from your table", join: "Join room", name: "Your name", table: "Table",
          host: "Host address", pin: "Room PIN", menu: "Menu", cart: "Your order",
          note: "Note (optional, e.g. less spicy)", place: "Place order", yourtable: "At your table",
          waiter: "Call waiter", bill: "Request bill", kitchen: "Kitchen", guest: "Order",
          orders: "Orders", calls: "Calls", clear: "Clear served", export: "Export CSV",
          placed: "Placed", preparing: "Preparing", served: "Served", cancelled: "Cancelled",
          done: "Done", total: "Total", empty: "Nothing yet.",
          connected: "Connected", connecting: "Connecting…", off: "Not connected",
          revenue: "Revenue", open: "Open", tables: "Tables", waiterCall: "Waiter called",
          billCall: "Bill requested", prep: "Preparing", serve: "Served", cancel: "Cancel",
          items: "Items", solo: "This device only", search: "Search the menu — name, tag, sku",
          all: "All", soldOut: "Sold out", soldOutShort: "out", menuTab: "Menu", report: "Shift report",
          addItem: "Add item", save: "Save item", reset: "Clear form", price: "Price (₹)", sku: "SKU (optional)",
          itemName: "Item name", undo: "Undo last move", split: "Split bill", heads: "heads",
          each: "each", covers: "Covers", average: "Average ticket", topItems: "Top sellers",
          printReport: "Print report", sound: "Sound", queued: "queued",
          newOrder: "New order", minutes: "min", edit: "Edit", del: "Delete", avail: "Available",
          soloHint: "One device runs the whole canteen. Nothing leaves this phone or laptop.",
          joinHint: "The host prints this address when it starts. Leave the PIN empty if the room has none.",
          menuHint: "Changes go to every device in the room at once. A sold-out item stays on bills already placed.",
          floor: "Floor", slip: "Bill slip", showSlip: "Show my bill", hideSlip: "Hide the slip",
          stock: "Stock (blank = unlimited)", left: "left", lowStock: "Running out",
          from: "Served from (0–23)", to: "until (0–23)", opts: "Modifiers, name:price",
          printSlip: "Print the slip", tileOpen: "open",
          printA4: "Print A4 sheet", sheet: "Shift report",
          menuBoard: "Print menu board (A3)", backup: "Download the shift",
          restore: "Restore from a file", allDay: "Served all day", prices: "prices in rupees" },
  };
  L.i18n.extend("en", S.en);
  function t(k) { return L.i18n.t(k); }

  /* ---- state ---- */
  var doc = C.newDoc();            /* the live board, rebuilt from the room's messages */
  var joined = false, kitchen = false, tab = "orders", status = "off";
  /* cart is keyed by dish + chosen modifiers, so "chai" and "chai + elaichi" are
     two lines. Older saved carts held plain numbers; those are dropped. */
  var cart = (function () {
    var saved = L.storage.get("canteen:cart", {}), out = {};
    Object.keys(saved || {}).forEach(function (k) {
      var v = saved[k];
      if (v && typeof v === "object" && v.sku && v.qty > 0) out[k] = { sku: v.sku, qty: v.qty, opts: v.opts || [] };
    });
    return out;
  })();
  var picks = {};        /* sku -> [option codes] currently chosen on the card */
  var me = L.storage.get("canteen:me", {});
  var client = null, heads = {}, filter = "", editing = "", soundOn = L.storage.get("canteen:sound", false);
  var outbox = L.storage.get("canteen:outbox", []);
  var floorSel = "", slipOpen = false, sheetOnly = false, boardOnly = false;
  var seenOrders = {}, seenCalls = {};

  /* ---- mode ----
   * demo   the landing page's frame: seeded board, nothing leaves the page
   * solo   one device runs the whole canteen, board persisted locally
   * room   a lan-host is the authority */
  var qs = new URLSearchParams(location.search);
  var demo = qs.get("demo") === "1";
  var solo = qs.get("solo") === "1";
  var BUILD = "1.5.0 · 2026-11-01";

  /* ---- boot ---- */
  L.theme.apply();
  L.seo.title("Canteen — order from your table");
  L.seo.description("Order from your table over the room's own Wi-Fi.");
  L.i18n.setLang("en");   /* the board ships English only */

  /* A scanned join code carries ?pin= (and ?host= when the board is published),
     so the guest lands already pointed at the room. */
  var qPin = qs.get("pin"), qHost = qs.get("host"), autoJoin = false;
  if (qPin) me.pin = qPin;
  if (qHost) me.host = qHost;

  $("name").value = me.name || "";
  $("table").value = me.table || "";
  /* A published board is served from a public hostname, so defaulting the room
     address to it would be a wrong answer. Only pre-fill when this page really is
     on a private address; otherwise leave the hint and let the guest paste the
     address the host printed. */
  var priv = /^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname || "");
  $("host").value = me.host || (priv ? Lan.hostUrl(8080) : "");
  $("pin").value = me.pin || "";
  $("build").textContent = "build " + BUILD;
  paintSound();

  if (demo) {
    doc = C.demoDoc();
    joined = true; status = "demo";
    kitchen = qs.get("view") === "kitchen";
    if (qs.get("tab") === "calls") tab = "calls";
    if (qs.get("tab") === "menu") tab = "menu";
    if (qs.get("tab") === "report") tab = "report";
    if (qs.get("tab") === "floor") tab = "floor";
    if (qs.get("slip") === "1") slipOpen = true;
    if (qs.get("sheet") === "1") { kitchen = true; tab = "report"; sheetOnly = true; }
    if (qs.get("board") === "1") { kitchen = true; tab = "menu"; boardOnly = true; }
    me = { name: "Aarti", table: qs.get("table") || "12", host: "", pin: "" };
    banner("Demo board — sample orders seeded in this page. " +
      (kitchen ? "Press Preparing / Served to move them along." : "Add to the cart and place the order.") +
      " Nothing is sent anywhere.", "warn");
  } else if (solo) {
    doc = C.fromJSON(L.storage.get("canteen:solo", ""));
    joined = true; status = "solo"; kitchen = true;
    banner(t("soloHint"), "info");
  }

  $("theme").addEventListener("click", function () { L.theme.toggle(); });
  $("sound").addEventListener("click", function () {
    soundOn = !soundOn; L.storage.set("canteen:sound", soundOn); paintSound(); if (soundOn) beep(1);
  });
  $("viewBtn").addEventListener("click", function () { kitchen = !kitchen; render(); });
  $("joinBtn").addEventListener("click", join);
  $("soloBtn").addEventListener("click", function () {
    var q = new URLSearchParams(location.search); q.set("solo", "1");
    location.search = q.toString();
  });
  $("placeBtn").addEventListener("click", placeOrder);
  $("waiterBtn").addEventListener("click", function () { call("waiter"); });
  $("billBtn").addEventListener("click", function () { call("bill"); });
  $("search").addEventListener("input", function () { filter = this.value; render(); });
  $("tabOrders").addEventListener("click", function () { tab = "orders"; render(); });
  $("tabCalls").addEventListener("click", function () { tab = "calls"; render(); });
  $("tabFloor").addEventListener("click", function () { tab = "floor"; render(); });
  $("tabMenu").addEventListener("click", function () { tab = "menu"; render(); });
  $("tabReport").addEventListener("click", function () { tab = "report"; render(); });
  $("clearBtn").addEventListener("click", function () { send({ t: "clear", by: me.name }); });
  $("undoBtn").addEventListener("click", function () { send({ t: "undo", by: me.name }); });
  $("exportBtn").addEventListener("click", exportCSV);
  $("printReport").addEventListener("click", function () { printReport(); });
  $("printA4").addEventListener("click", function () { printA4(); });
  $("boardBtn").addEventListener("click", function () { printMenuBoard(); });
  $("boardBtn2").addEventListener("click", function () { printMenuBoard(); });
  $("backupBtn").addEventListener("click", downloadShift);
  $("restoreBtn").addEventListener("click", function () { $("restoreFile").click(); });
  $("restoreFile").addEventListener("change", restoreShift);
  $("slipBtn").addEventListener("click", function () { slipOpen = !slipOpen; render(); });
  $("miSave").addEventListener("click", saveItem);
  $("miReset").addEventListener("click", function () { editing = ""; fillItemForm(null); });

  if (!demo && !solo && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register("sw.js").then(function (r) { if (r.update) r.update(); }).catch(function () {});
  }

  function banner(text, kind) {
    var b = $("demoBar");
    b.textContent = text;
    b.className = "demobar" + (kind === "info" ? " off" : "");
    b.hidden = false;
  }

  function label() {
    $("tag").textContent = t("tag");
    $("joinH").textContent = t("join");
    $("lName").textContent = t("name"); $("lTable").textContent = t("table");
    $("lHost").textContent = t("host"); $("lPin").textContent = t("pin");
    $("joinBtn").textContent = t("join"); $("soloBtn").textContent = t("solo");
    $("joinHint").textContent = t("joinHint");
    $("hMenu").textContent = t("menu"); $("hCart").textContent = t("cart"); $("hMine").textContent = t("yourtable");
    $("note").placeholder = t("note"); $("placeBtn").textContent = t("place");
    $("search").placeholder = t("search");
    $("waiterBtn").textContent = t("waiter"); $("billBtn").textContent = t("bill");
    $("viewBtn").textContent = kitchen ? t("guest") : t("kitchen");
    $("hKitchen").textContent = t("kitchen");
    $("tabOrders").textContent = t("orders"); $("tabCalls").textContent = t("calls");
    $("tabFloor").textContent = t("floor");
    $("tabMenu").textContent = t("menuTab"); $("tabReport").textContent = t("report");
    $("slipBtn").textContent = slipOpen ? t("hideSlip") : t("showSlip");
    $("lItemStock").textContent = t("stock");
    $("lItemFrom").textContent = t("from"); $("lItemTo").textContent = t("to");
    $("lItemOpts").textContent = t("opts");
    $("miHint").textContent = t("menuHint");
    $("clearBtn").textContent = t("clear"); $("exportBtn").textContent = t("export");
    $("undoBtn").textContent = "↶ " + t("undo");
    $("lItemName").textContent = t("itemName"); $("lItemPrice").textContent = t("price");
    $("lItemSku").textContent = t("sku"); $("miSave").textContent = t("save"); $("miReset").textContent = t("reset");
    $("printReport").textContent = t("printReport");
    $("printA4").textContent = t("printA4");
    $("boardBtn").textContent = t("menuBoard"); $("boardBtn2").textContent = t("menuBoard");
    $("backupBtn").textContent = t("backup"); $("restoreBtn").textContent = t("restore");
    paintFilters();
  }

  function paintSound() {
    $("sound").setAttribute("aria-pressed", soundOn ? "true" : "false");
    $("sound").style.color = soundOn ? "var(--acc)" : "";
  }

  /* ---- the room connection ---- */
  function join() {
    var name = $("name").value.trim(), table = $("table").value.trim();
    var host = $("host").value.trim(), pin = $("pin").value.trim();
    if (!host) { $("joinMsg").textContent = t("host"); return; }
    me = { name: name, table: table, host: host, pin: pin };
    L.storage.set("canteen:me", me);
    $("joinMsg").textContent = t("connecting");
    status = "connecting"; paintStatus();
    try { if (client) client.close(); } catch (e) {}
    client = Lan.client({
      url: host, pin: pin,
      onOpen: function () { joined = true; status = "on"; paintStatus(); flush(); render(); },
      onMessage: function (m) { inbound(m); },
      onError: function () { status = "off"; paintStatus(); }
    });
  }

  /* Every message — from the room, from this device's own actions — lands here. */
  function inbound(m) {
    if (!m || typeof m !== "object") return;
    C.apply(doc, m);
    notice(m);
    render();
  }

  function send(msg) {
    if (!msg.by) msg.by = me.name || "guest";
    if (demo) { inbound(msg); return; }                 /* the room is this page */
    if (solo) { inbound(msg); persistSolo(); return; }   /* the board is this device */
    if (status === "on" && client) {
      client.send(msg).catch(function () { queue(msg); });
    } else {
      queue(msg);
    }
  }

  /* ---- the outbox: an order placed while the Wi-Fi blinks is not lost ---- */
  function queue(msg) {
    outbox.push(msg);
    if (outbox.length > 100) outbox.shift();
    L.storage.set("canteen:outbox", outbox);
    paintStatus();
  }
  function flush() {
    if (!outbox.length) return;
    var pending = outbox.slice();
    outbox = [];
    L.storage.set("canteen:outbox", outbox);
    pending.forEach(function (m) { client.send(m).catch(function () { queue(m); }); });
    paintStatus();
  }
  function persistSolo() { L.storage.set("canteen:solo", C.toJSON(doc)); }

  /* ---- sound + announcements: the kitchen should hear a new order ---- */
  var actx = null;
  function beep(n) {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = n > 1 ? 880 : 660;
      g.gain.value = 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + 0.12);
    } catch (e) {}
    try { if (navigator.vibrate) navigator.vibrate(60); } catch (e) {}
  }
  function announce(text) { $("live").textContent = text; }
  function notice(m) {
    if (m.t === "order" && !seenOrders[m.id]) {
      seenOrders[m.id] = 1;
      if (kitchen) { announce(t("newOrder") + " — " + t("table") + " " + C.normTable(m.table)); beep(1); }
    } else if (m.t === "call") {
      var k = C.normTable(m.table) + ":" + m.kind;
      if (!seenCalls[k]) { seenCalls[k] = 1; if (kitchen) { announce(t("waiterCall") + " " + k); beep(2); } }
    }
  }

  function paintStatus() {
    var d = $("status").firstChild, txt;
    if (status === "demo") txt = "Demo";
    else if (status === "solo") txt = t("solo");
    else if (status === "on") txt = t("connected") + (outbox.length ? " · " + outbox.length + " " + t("queued") : "");
    else if (status === "connecting") txt = t("connecting");
    else txt = t("off") + (outbox.length ? " · " + outbox.length + " " + t("queued") : "");
    d.className = "dot" + (status === "on" || status === "solo" ? " on" : outbox.length ? " warn" : "");
    $("statusText").textContent = txt;
  }

  function placeOrder() {
    var items = Object.keys(cart).map(function (k) {
      return { sku: cart[k].sku, qty: cart[k].qty, opts: cart[k].opts || [] };
    });
    if (!items.length) return;
    send({ t: "order", id: C.newId(), table: me.table || "?", by: me.name || "guest",
           note: $("note").value.trim(), items: items, ts: Date.now() });
    cart = {}; L.storage.set("canteen:cart", cart); $("note").value = ""; render();
  }

  function call(kind) { send({ t: "call", table: me.table || "?", kind: kind, by: me.name }); }

  function exportCSV() {
    var rows = doc.orders.map(C.orderToRow);
    if (!rows.length) return;
    L.csv.download("canteen-orders.csv", L.csv.toCSV(rows));
  }

  /* ---- printing: the browser prints the docket, offline ---- */
  function printDocket(title, lines, foot) {
    var area = $("printArea");
    area.innerHTML = '<div style="font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#000;padding:8px">' +
      '<div style="font-size:16px;font-weight:700;letter-spacing:.1em">' + esc(title) + "</div>" +
      '<div style="border-top:1px dashed #000;margin:6px 0"></div>' +
      lines.map(function (l) { return '<div style="display:flex;justify-content:space-between;gap:12px"><span>' +
        esc(l[0]) + "</span><span>" + esc(l[1]) + "</span></div>"; }).join("") +
      (foot ? '<div style="border-top:1px dashed #000;margin:6px 0"></div><div>' + esc(foot) + "</div>" : "") +
      "</div>";
    window.print();
  }
  function printOrder(o, kind) {
    var lines = o.items.map(function (l) { return [l.qty + " × " + l.name, C.money(l.price * l.qty)]; });
    lines.push([t("total"), C.money(C.totalOf(o))]);
    printDocket((kind === "bill" ? "BILL · " : "KOT · ") + t("table") + " " + o.table,
      lines, (o.by || "") + (o.note ? " · " + o.note : ""));
  }
  /* ---- the shift as a file: no shell, no database, no backup job ---- */
  function saveFile(name, text, mime) {
    var blob = new Blob([text], { type: (mime || "text/plain") + ";charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function hostBase() { return String(me.host || "").replace(/\/+$/, ""); }

  function downloadShift() {
    if (status === "on" && hostBase()) {
      /* the room's own journal: every message, in order */
      window.open(hostBase() + "/journal", "_blank");
      $("backupMsg").textContent = "The room's journal is on its way from " + hostBase() + ".";
      return;
    }
    saveFile("canteen-shift.json", C.toJSON(doc), "application/json");
    $("backupMsg").textContent = "Saved this board as a snapshot.";
  }

  function restoreShift(ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var text = String(reader.result || "");
      if (status === "on" && hostBase()) {
        fetch(hostBase() + "/journal", {
          method: "POST",
          headers: { "Content-Type": "application/x-ndjson", "X-Room-Pin": me.pin || "" },
          body: text
        }).then(function (r) { return r.json(); }).then(function (j) {
          $("backupMsg").textContent = j.ok
            ? "Restored " + j.restored + " message(s)" + (j.refused ? ", " + j.refused + " refused" : "") + "."
            : "The room refused it: " + j.error;
        }).catch(function () { $("backupMsg").textContent = "Could not reach the room host."; });
        return;
      }
      try {
        doc = C.fromJSON(text);
        if (status === "solo") persistSolo();
        $("backupMsg").textContent = "Restored the board from a snapshot.";
        render();
      } catch (e) { $("backupMsg").textContent = "That file is not a Canteen snapshot."; }
    };
    reader.readAsText(file);
    ev.target.value = "";
  }

  /* The same shift, on A4, for the accounts: figures, what sold, what each table
   * ran up, and what is nearly gone. */
  function buildA4() {
    var r = C.report(doc);
    var totals = C.tableTotals(doc);
    var tiles = C.floorPlan(doc, Date.now());
    function fig(label, value) { return '<div class="fig"><b>' + esc(value) + "</b><span>" + esc(label) + "</span></div>"; }
    var html = '<div class="a4"><h1>' + esc(t("sheet")) + "</h1>" +
      '<div class="meta">' + esc(roomName()) + " · " + esc(stamp()) + "</div>" +
      '<div class="figs">' + fig(t("covers"), r.covers) + fig(t("revenue"), C.money(r.revenue)) +
      fig(t("average"), C.money(r.average)) + fig(t("cancelled"), r.cancelled) +
      fig(t("tables"), r.tables) + "</div>";

    html += "<h2>" + esc(t("topItems")) + '</h2><table><tr><th>Item</th><th class="n">Qty</th><th class="n">Value</th></tr>';
    if (!r.top.length) html += '<tr><td colspan="3">' + esc(t("empty")) + "</td></tr>";
    r.top.forEach(function (x) {
      html += "<tr><td>" + esc(x.name) + '</td><td class="n">' + x.qty + '</td><td class="n">' + C.money(x.revenue) + "</td></tr>";
    });
    html += "</table>";

    html += "<h2>Tables</h2><table><tr><th>" + esc(t("table")) + '</th><th class="n">' + esc(t("orders")) +
      '</th><th class="n">' + esc(t("total")) + "</th></tr>";
    if (!tiles.length) html += '<tr><td colspan="3">' + esc(t("empty")) + "</td></tr>";
    tiles.forEach(function (tl) {
      html += "<tr><td>" + esc(tl.table) + '</td><td class="n">' + tl.orders + '</td><td class="n">' +
        C.money(totals[tl.table] || 0) + "</td></tr>";
    });
    html += "</table>";

    if (r.lowStock.length) {
      html += "<h2>" + esc(t("lowStock")) + '</h2><table><tr><th>Item</th><th class="n">Left</th></tr>';
      r.lowStock.forEach(function (x) {
        html += "<tr><td>" + esc(x.name) + '</td><td class="n">' + x.stock + "</td></tr>";
      });
      html += "</table>";
    }
    html += "</div>";
    $("printArea").innerHTML = html;
    return html;
  }

  /* One page, any paper: the @page size is injected for this print only. */
  function setPageSize(size) {
    var old = document.getElementById("pageSize");
    if (old) old.parentNode.removeChild(old);
    var st = document.createElement("style");
    st.id = "pageSize";
    st.textContent = "@page{size:" + (size || "A4") + ";margin:14mm}";
    /* appended to the body, after the app's own stylesheet, or that one wins */
    document.body.appendChild(st);
  }

  function printSheet(html, size) {
    setPageSize(size);
    $("printArea").innerHTML = html;
    window.print();
    setTimeout(function () { var x = document.getElementById("pageSize"); if (x) x.parentNode.removeChild(x); }, 1500);
  }

  function printA4() { printSheet(buildA4(), "A4"); }

  /* The menu for the wall: A3, two columns, the same prices the board is running. */
  function buildMenuBoard() {
    var groups = {}, order = [];
    doc.menu.forEach(function (m) {
      var g = m.window ? windowLabel(m.window) : t("allDay");
      if (!groups[g]) { groups[g] = []; order.push(g); }
      groups[g].push(m);
    });
    order.sort(function (a, b) {
      if (a === t("allDay")) return -1;
      if (b === t("allDay")) return 1;
      return a.localeCompare(b);
    });
    var html = '<div class="a3"><h1>' + esc(roomName()) + " — " + esc(t("menu")) + "</h1>" +
      '<div class="meta">' + esc(stamp()) + " · " + esc(t("prices")) + "</div>";
    order.forEach(function (g) {
      html += "<h2>" + esc(g) + '</h2><div class="cols">';
      groups[g].slice().sort(function (a, b) { return a.price - b.price || a.name.localeCompare(b.name); })
        .forEach(function (m) {
          var sub = [];
          if ((m.tags || []).length) sub.push(m.tags.join(" · "));
          if ((m.options || []).length) sub.push(m.options.map(function (o) {
            return o.name + (o.price ? " +" + C.money(o.price) : ""); }).join(" · "));
          if (m.soldOut || m.stock === 0) sub.push(t("soldOut"));
          html += '<div class="dish"><span class="nm">' + esc(m.name) + '</span><span class="dots"></span>' +
            '<span class="pr">' + C.money(m.price) + "</span>" +
            (sub.length ? '<span class="sub">' + esc(sub.join(" · ")) + "</span>" : "") + "</div>";
        });
      html += "</div>";
    });
    return html + "</div>";
  }

  function printMenuBoard() { printSheet(buildMenuBoard(), "A3"); }

  /* dd/mm/yyyy hh:mm — the room is in India, and an A4 sheet is read on paper */
  function stamp() {
    var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
    return p(d.getDate()) + "/" + p(d.getMonth() + 1) + "/" + d.getFullYear() + " " +
      p(d.getHours()) + ":" + p(d.getMinutes());
  }

  /* A name for the sheet: the room, if we know it, else the table's own board. */
  function roomName() {
    if (status === "solo") return "Solo board";
    if (me.host) return me.host.replace(/^https?:\/\//, "");
    return location.host || "Canteen";
  }

  function printReport() {
    var r = C.report(doc);
    var lines = [[t("covers"), String(r.covers)], [t("revenue"), C.money(r.revenue)],
                 [t("average"), C.money(r.average)], [t("cancelled"), String(r.cancelled)]];
    r.top.forEach(function (x) { lines.push([x.qty + " × " + x.name, C.money(x.revenue)]); });
    printDocket("SHIFT REPORT", lines, new Date().toLocaleString());
  }

  /* ---- the menu editor ---- */
  function paintFilters() {
    var f = $("filters");
    f.innerHTML = "";
    [["", t("all")], ["veg", "veg"], ["spicy", "spicy"], ["fried", "fried"], ["dairy", "dairy"]].forEach(function (p) {
      var b = document.createElement("button");
      b.type = "button";
      b.textContent = p[1];
      b.className = filter === p[0] ? "on" : "";
      b.addEventListener("click", function () { filter = p[0]; paintFilters(); render(); });
      f.appendChild(b);
    });
  }

  function slug(s) {
    return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
  }

  function fillItemForm(item) {
    editing = item ? item.sku : "";
    $("miName").value = item ? item.name : "";
    $("miPrice").value = item ? (item.price / 100) : "";
    $("miSku").value = item ? item.sku : "";
    $("miStock").value = item && item.stock != null ? item.stock : "";
    $("miFrom").value = item && item.window && item.window.from != null ? item.window.from : "";
    $("miTo").value = item && item.window && item.window.to != null ? item.window.to : "";
    $("miOpts").value = item && (item.options || []).length
      ? item.options.map(function (o) { return o.name + ":" + (o.price / 100); }).join(", ") : "";
    var tags = item ? (item.tags || []) : [];
    var box = $("miTags");
    box.innerHTML = "";
    Object.keys(C.TAGS).forEach(function (tag) {
      var b = document.createElement("button");
      b.type = "button"; b.textContent = tag; b.dataset.tag = tag;
      b.className = tags.indexOf(tag) >= 0 ? "on" : "";
      b.addEventListener("click", function () { b.classList.toggle("on"); });
      box.appendChild(b);
    });
    $("miSave").textContent = item ? t("save") : t("addItem");
    $("miMsg").textContent = item ? item.sku : "";
  }

  /* "Extra chutney:10, No sugar:0" -> [{code, name, price}] in paise */
  function parseOptions(text) {
    return String(text || "").split(",").map(function (part) {
      part = part.trim();
      if (!part) return null;
      var bits = part.split(":");
      var name = (bits[0] || "").trim();
      var rupees = parseFloat(bits[1]);
      if (!name) return null;
      return {
        code: slug(name), name: name,
        price: isFinite(rupees) && rupees > 0 ? Math.round(rupees * 100) : 0
      };
    }).filter(Boolean);
  }

  function windowLabel(w) {
    function hh(n) { return (n < 10 ? "0" : "") + n + ":00"; }
    if (!w) return "";
    if (w.from == null) return "until " + hh(w.to);
    if (w.to == null) return "from " + hh(w.from);
    return hh(w.from) + "–" + hh(w.to);
  }

  function saveItem() {
    var name = $("miName").value.trim();
    var rupees = parseFloat($("miPrice").value);
    if (!name) { $("miMsg").textContent = t("itemName"); return; }
    if (!isFinite(rupees) || rupees < 0) { $("miMsg").textContent = t("price"); return; }
    var sku = C.normSku($("miSku").value.trim() || slug(name));
    if (!sku) { $("miMsg").textContent = t("sku"); return; }
    var tags = [].slice.call($("miTags").querySelectorAll("button.on")).map(function (b) { return b.dataset.tag; });
    var existing = C.menuItem(doc, sku);
    send({ t: "menu:set", by: me.name, item: {
      sku: sku, name: name, price: Math.round(rupees * 100), tags: tags,
      names: existing ? existing.names : {}, soldOut: existing ? existing.soldOut : false,
      stock: C.normStock($("miStock").value),
      from: C.normHour($("miFrom").value), to: C.normHour($("miTo").value),
      options: parseOptions($("miOpts").value)
    } });
    fillItemForm(null);
    $("miMsg").textContent = t("menu") + ": " + name;
  }

  /* ---- rendering ---- */
  function statusPill(s) { return '<span class="pill s-' + s + '">' + t(s) + "</span>"; }

  function render() {
    label();
    paintStatus();
    $("app").hidden = !joined;
    $("join").hidden = joined;
    $("guest").hidden = kitchen;
    $("kitchen").hidden = !kitchen;
    if (!joined) return;

    /* ---- guest: menu, cart, my table ---- */
    var hour = new Date().getHours();
    var list = C.searchMenu(doc, $("search").value, { tag: filter, hour: hour });
    var mEl = $("menu"); mEl.innerHTML = "";
    /* items off the menu because of the clock are counted, not silently missing */
    var offHours = doc.menu.filter(function (m) { return C.isAvailable(m) && !C.servesAt(m, hour); }).length;
    if (offHours) {
      $("offHours").hidden = false;
      $("offHours").textContent = offHours + (offHours === 1 ? " dish is" : " dishes are") +
        " off the menu at this hour.";
    } else { $("offHours").hidden = true; }
    if (!list.length) mEl.innerHTML = '<div class="card empty">' + t("empty") + "</div>";
    list.forEach(function (it) {
      var picked = (picks[it.sku] || []).filter(function (code) {
        return (it.options || []).some(function (o) { return o.code === code; });
      });
      var key = C.lineKey(it.sku, picked);
      var q = cart[key] ? cart[key].qty : 0;
      var off = !C.isAvailable(it);
      var card = document.createElement("div");
      card.className = "card" + (off ? " sold" : "");
      var tagHtml = (it.tags || []).map(function (x) { return '<span class="tag">' + esc(x) + "</span>"; }).join("");
      if (it.stock != null) tagHtml += '<span class="tag' + (it.stock <= 3 ? " on" : "") + '">' +
        (it.stock > 0 ? it.stock + " " + t("left") : t("soldOutShort")) + "</span>";
      if (it.window) tagHtml += '<span class="tag">' + windowLabel(it.window) + "</span>";
      var optHtml = (it.options || []).length ? '<div class="opts">' + it.options.map(function (o) {
        return '<button type="button" class="opt' + (picked.indexOf(o.code) >= 0 ? " on" : "") +
          '" data-opt="' + esc(o.code) + '">' + esc(o.name) +
          (o.price ? " +" + C.money(o.price) : "") + "</button>";
      }).join("") + "</div>" : "";
      card.innerHTML = '<div class="item"><div><b>' + esc(it.name) + "</b><br><small>" +
        C.money(it.price) + "</small><br>" + tagHtml + "</div>" +
        (off ? '<span class="tag">' + t("soldOutShort") + "</span>" :
          '<div class="qty"><button data-m="-1" aria-label="−">&minus;</button><span>' + q +
          '</span><button data-m="1" aria-label="+">+</button></div>') + "</div>" + optHtml;
      card.querySelectorAll("[data-opt]").forEach(function (b) {
        b.addEventListener("click", function () {
          var code = b.getAttribute("data-opt");
          var now = (picks[it.sku] || []).slice();
          var at = now.indexOf(code);
          if (at >= 0) now.splice(at, 1); else now.push(code);
          picks[it.sku] = now;
          render();
        });
      });
      card.querySelectorAll("[data-m]").forEach(function (b) {
        b.addEventListener("click", function () {
          var step = parseInt(b.getAttribute("data-m"), 10);
          var line = cart[key] || { sku: it.sku, qty: 0, opts: picked.slice() };
          line.qty = Math.max(0, Math.min(C.MAX_QTY, line.qty + step));
          line.opts = picked.slice();
          if (line.qty > 0) cart[key] = line; else delete cart[key];
          L.storage.set("canteen:cart", cart);
          render();
        });
      });
      mEl.appendChild(card);
    });

    var cEl = $("cart"); cEl.innerHTML = "";
    var lines = Object.keys(cart).filter(function (k) { return cart[k] && cart[k].qty > 0; });
    if (!lines.length) { cEl.innerHTML = '<div class="empty">' + t("empty") + "</div>"; }
    else {
      var total = 0;
      lines.forEach(function (k) {
        var line = cart[k];
        var it = C.menuItem(doc, line.sku); if (!it) return;
        var chosen = C.resolveOptions(it, line.opts);
        var each = it.price + C.addOf(chosen);
        total += each * line.qty;
        var extra = chosen.length ? " · " + chosen.map(function (o) { return o.name; }).join(", ") : "";
        cEl.insertAdjacentHTML("beforeend", '<div class="line"><span>' + esc(it.name) + extra +
          " &times; " + line.qty + "</span><span>" + C.money(each * line.qty) + "</span></div>");
      });
      cEl.insertAdjacentHTML("beforeend", '<div class="line"><b>' + t("total") + '</b><b>' + C.money(total) + "</b></div>");
    }

    var mine = C.ordersForTable(doc, me.table || "?");
    var mineEl = $("mine"); mineEl.innerHTML = "";
    if (!mine.length) mineEl.innerHTML = '<div class="card empty">' + t("empty") + "</div>";
    else mine.slice().reverse().forEach(function (o) { mineEl.appendChild(orderCard(o, false)); });
    renderSlip();
    var calls = C.callsForTable(doc, me.table || "?");
    if (calls.length) mineEl.insertAdjacentHTML("afterbegin",
      '<div class="card mut">' + calls.map(function (c) {
        return t(c.kind === "bill" ? "billCall" : "waiterCall"); }).join(" · ") + "</div>");

    /* ---- kitchen ---- */
    var st = C.stats(doc);
    $("kstats").innerHTML =
      stat(t("open"), st.open) + stat(t("tables"), st.tables) + stat(t("items"), st.items) +
      stat(t("revenue"), C.money(st.revenue)) + stat(t("soldOut"), st.soldOut) +
      stat(t("menuTab"), st.menu);

    var depth = C.undoDepth(doc);
    $("undoBtn").textContent = "↶ " + t("undo") + (depth ? " (" + depth + ")" : "");
    $("undoBtn").disabled = depth === 0;

    ["orders", "calls", "floor", "menu", "report"].forEach(function (k) {
      var b = $("tab" + k.charAt(0).toUpperCase() + k.slice(1));
      b.className = (tab === k ? "primary " : "ghost ") + "sm";
    });
    $("korders").hidden = tab !== "orders";
    $("kcalls").hidden = tab !== "calls";
    $("kfloor").hidden = tab !== "floor";
    $("kmenu").hidden = tab !== "menu";
    $("kreport").hidden = tab !== "report";

    if (tab === "orders") renderOrders();
    if (tab === "floor") renderFloor();
    if (tab === "calls") renderCalls();
    if (tab === "menu") renderMenuEditor();
    if (tab === "report") renderReport();
  }

  function stat(label, value) { return '<div class="card"><small class="mut">' + label + "</small><b>" + value + "</b></div>"; }

  function renderOrders() {
    var kEl = $("klist"); kEl.innerHTML = "";
    if (!doc.orders.length) { kEl.innerHTML = '<div class="card empty">' + t("empty") + "</div>"; return; }
    var byTable = {};
    doc.orders.forEach(function (o) { (byTable[o.table] = byTable[o.table] || []).push(o); });
    var totals = C.tableTotals(doc);
    Object.keys(byTable).sort().forEach(function (tb) {
      var h = document.createElement("div");
      h.className = "table-h";
      var n = heads[tb] || 2;
      var split = C.splitBill(doc, tb, n);
      h.innerHTML = "<b>" + t("table") + " " + esc(tb) + '</b><span class="mut">' + C.money(totals[tb] || 0) + "</span>";
      var sp = document.createElement("span");
      sp.className = "row";
      sp.innerHTML = '<span class="mut" style="font-size:12px">' + t("split") + "</span>" +
        '<button class="sm ghost" data-h="-1">−</button><span class="mut">' + n + " " + t("heads") +
        '</span><button class="sm ghost" data-h="1">+</button>' +
        '<span class="mut" style="font-size:12px">' + C.money(split.shares[0]) + " " + t("each") + "</span>";
      sp.querySelectorAll("button").forEach(function (b) {
        b.addEventListener("click", function () {
          heads[tb] = Math.max(1, Math.min(50, n + parseInt(b.getAttribute("data-h"), 10)));
          render();
        });
      });
      h.appendChild(sp);
      kEl.appendChild(h);
      byTable[tb].forEach(function (o) { kEl.appendChild(orderCard(o, true)); });
    });
  }

  function renderCalls() {
    var cEl = $("kcalls"); cEl.innerHTML = "";
    if (!doc.calls.length) { cEl.innerHTML = '<div class="card empty">' + t("empty") + "</div>"; return; }
    doc.calls.forEach(function (c) {
      var card = document.createElement("div"); card.className = "card row";
      card.innerHTML = "<b>" + t("table") + " " + esc(c.table) + '</b> <span class="mut">' +
        t(c.kind === "bill" ? "billCall" : "waiterCall") + '</span><span class="grow"></span>';
      var b = document.createElement("button"); b.className = "sm"; b.textContent = t("done");
      b.addEventListener("click", function () { send({ t: "ack", table: c.table, kind: c.kind, by: me.name }); });
      card.appendChild(b); cEl.appendChild(card);
    });
  }

  /* ---- the floor: one tile per table, tap to open it ---- */
  function renderFloor() {
    var box = $("kfloor");
    box.innerHTML = "";
    var tiles = C.floorPlan(doc, Date.now());
    if (!tiles.length) { box.innerHTML = '<div class="card empty">' + t("empty") + "</div>"; return; }
    var grid = document.createElement("div");
    grid.className = "floor";
    tiles.forEach(function (tl) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "tile" + (floorSel === tl.table ? " on" : "") + (tl.calls.length ? " call" : "");
      b.setAttribute("aria-label", t("table") + " " + tl.table + ", " + C.money(tl.total));
      b.innerHTML = "<b>" + esc(tl.table) + "</b><span>" + C.money(tl.total) + "</span><small>" +
        tl.open + " " + t("tileOpen") + (tl.oldest != null ? " · " + tl.oldest + " " + t("minutes") : "") +
        "</small>" + (tl.calls.length ? "<em>" + tl.calls.map(function (k) {
          return k === "bill" ? t("billCall") : t("waiterCall"); }).join(" · ") + "</em>" : "");
      b.addEventListener("click", function () { floorSel = floorSel === tl.table ? "" : tl.table; render(); });
      grid.appendChild(b);
    });
    box.appendChild(grid);
    if (!floorSel) return;
    var h = document.createElement("div");
    h.className = "table-h";
    h.innerHTML = "<b>" + t("table") + " " + esc(floorSel) + '</b><span class="mut">' +
      C.money(C.tableTotals(doc)[floorSel] || 0) + "</span>";
    box.appendChild(h);
    C.ordersForTable(doc, floorSel).forEach(function (o) { box.appendChild(orderCard(o, true)); });
  }

  /* ---- the guest's own slip: the bill, and a code the counter can read ---- */
  function renderSlip() {
    var el = $("slip");
    if (!slipOpen) { el.hidden = true; return; }
    var slip = C.billSlip(doc, me.table || "?");
    if (!slip.lines.length) { el.hidden = true; return; }
    /* short enough to stay a small QR: table, total in paise, covers, first id */
    var payload = ("CANTEEN|" + slip.table + "|" + slip.total + "|" + slip.count + "|" + (slip.ids[0] || "")).slice(0, 70);
    var svg = (window.QR && window.QR.toSVG) ? window.QR.toSVG(payload, { scale: 4, border: 2, dark: "#14120f" }) : "";
    el.innerHTML = '<div class="card slipcard" style="margin-top:10px">' +
      '<div class="slipqr">' + svg + "</div>" +
      '<div class="slipbody"><b>' + t("table") + " " + esc(slip.table) + "</b>" +
      slip.lines.map(function (l) {
        return '<div class="line"><span>' + esc(l.name) + " &times; " + l.qty + "</span><span>" +
          C.money(l.price * l.qty) + "</span></div>";
      }).join("") +
      '<div class="line"><b>' + t("total") + "</b><b>" + C.money(slip.total) + "</b></div>" +
      '<small class="mut">' + slip.count + " " + t("orders") + " · " + esc(payload) + "</small>" +
      '<div class="row" style="margin-top:8px"><button class="sm ghost" id="slipPrint">' +
      t("printSlip") + "</button></div></div></div>";
    el.hidden = false;
    var pb = $("slipPrint");
    if (pb) pb.addEventListener("click", function () {
      printDocket(t("slip") + " · " + t("table") + " " + slip.table,
        slip.lines.map(function (l) { return [l.qty + " × " + l.name, C.money(l.price * l.qty)]; })
          .concat([[t("total"), C.money(slip.total)]]),
        payload);
    });
  }

  function renderMenuEditor() {
    var box = $("miList");
    box.innerHTML = "";
    if (!doc.menu.length) { box.innerHTML = '<div class="empty">' + t("empty") + "</div>"; return; }
    doc.menu.forEach(function (m) {
      var row = document.createElement("div");
      row.className = "mi";
      row.innerHTML = "<div><b>" + esc(m.name) + '</b> <span class="mut">' + esc(m.sku) + "</span><br>" +
        '<small class="mut">' + C.money(m.price) + " · " +
        (m.tags || []).join(" ") + (m.soldOut ? " · " + t("soldOut") : "") +
        (m.stock != null ? " · " + m.stock + " " + t("left") : "") +
        (m.window ? " · " + windowLabel(m.window) : "") +
        ((m.options || []).length ? " · " + m.options.length + " " + t("opts").toLowerCase() : "") + "</small></div>";
      var acts = document.createElement("div");
      acts.className = "acts";
      var bSold = document.createElement("button");
      bSold.className = "sm ghost";
      bSold.textContent = m.soldOut ? t("avail") : t("soldOut");
      bSold.style.color = m.soldOut ? "var(--acc)" : "";
      bSold.addEventListener("click", function () { send({ t: "menu:sold", sku: m.sku, soldOut: !m.soldOut, by: me.name }); });
      var bEdit = document.createElement("button");
      bEdit.className = "sm ghost"; bEdit.textContent = t("edit");
      bEdit.addEventListener("click", function () { fillItemForm(m); window.scrollTo({ top: 0, behavior: "smooth" }); });
      var bDel = document.createElement("button");
      bDel.className = "sm danger"; bDel.textContent = t("del");
      bDel.addEventListener("click", function () { send({ t: "menu:del", sku: m.sku, by: me.name }); });
      acts.appendChild(bSold); acts.appendChild(bEdit); acts.appendChild(bDel);
      row.appendChild(acts);
      box.appendChild(row);
    });
  }

  function renderReport() {
    var r = C.report(doc);
    var html = '<div class="stats">' + stat(t("covers"), r.covers) + stat(t("revenue"), C.money(r.revenue)) +
      stat(t("average"), C.money(r.average)) + stat(t("cancelled"), r.cancelled) + "</div>";
    html += "<h2>" + t("topItems") + "</h2>";
    if (!r.top.length) html += '<div class="empty">' + t("empty") + "</div>";
    else r.top.forEach(function (x) {
      html += '<div class="line"><span>' + esc(x.name) + " &times; " + x.qty + "</span><span>" + C.money(x.revenue) + "</span></div>";
    });
    if (r.lowStock.length) {
      html += "<h2>" + t("lowStock") + "</h2>";
      r.lowStock.forEach(function (x) {
        html += '<div class="line"><span>' + esc(x.name) + "</span><span>" + x.stock + " " + t("left") + "</span></div>";
      });
    }
    $("reportBody").innerHTML = html;
  }

  function orderCard(o, actions) {
    var card = document.createElement("div"); card.className = "order";
    var lines = o.items.map(function (l) {
      return l.qty + "× " + esc(l.name) + (l.opts && l.opts.length
        ? ' <span class="mut">· ' + l.opts.map(function (x) { return esc(x.name); }).join(", ") + "</span>" : "");
    }).join("<br>");
    var age = C.ageMinutes(o, Date.now());
    card.innerHTML = '<div class="top"><b>' + t("table") + " " + esc(o.table) + " · " + esc(o.by) + "</b>" +
      statusPill(o.status) + "</div>" +
      '<div class="mut">' + lines + "</div>" +
      (o.note ? '<div class="mut">“' + esc(o.note) + '”</div>' : "") +
      '<div class="top" style="margin-top:6px"><span class="mut">' + C.money(C.totalOf(o)) +
      (age != null && o.status !== "served" && o.status !== "cancelled" ? " · " + age + " " + t("minutes") : "") +
      '</span><span class="grow"></span></div>';
    var bar = card.querySelector(".top:last-child");
    if (actions) {
      [["preparing", t("prep")], ["served", t("serve")], ["cancelled", t("cancel")]].forEach(function (p) {
        var b = document.createElement("button"); b.className = "sm"; b.textContent = p[1];
        b.addEventListener("click", function () { send({ t: "status", id: o.id, status: p[0], by: me.name }); });
        bar.appendChild(b);
      });
      var pk = document.createElement("button"); pk.className = "sm ghost"; pk.textContent = "KOT";
      pk.addEventListener("click", function () { printOrder(o, "kot"); });
      bar.appendChild(pk);
      var pb = document.createElement("button"); pb.className = "sm ghost"; pb.textContent = "Bill";
      pb.addEventListener("click", function () { printOrder(o, "bill"); });
      bar.appendChild(pb);
    }
    return card;
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  fillItemForm(null);
  paintStatus(); label(); render();
  if (sheetOnly) { setPageSize("A4"); $("printArea").innerHTML = buildA4(); }
  if (boardOnly) { setPageSize("A3"); $("printArea").innerHTML = buildMenuBoard(); }

  /* one tap becomes none: the code already carried the room */
  if (qPin && !demo && !solo && $("host").value) join();
})();
</script>

<script>
window.__smokeTest = function () {
  var out = []; function ok(n, c) { out.push((c ? "PASS " : "FAIL ") + n); }
  ok("the document rendered", !!document.body && document.body.children.length > 0);
  ok("a heading is present", !!document.querySelector("h1, h2"));
  ok("no script threw during load", !window.__bootError);
  var kits = ["Canteen","Loom","Lan","UI","Search","Srs","Game","Art","Audio","Ml","Astro"];
  var found = kits.filter(function (k) { return window[k]; });
  ok("at least one kit is loaded (" + (found.join(", ") || "none") + ")", found.length > 0);
  try { localStorage.setItem("__smoke","1"); ok("storage works", localStorage.getItem("__smoke") === "1"); localStorage.removeItem("__smoke"); } catch (e) { ok("storage works", false); }
  console.log(out.join("\n"));
  if (location.search.indexOf("test") >= 0) { var d = document.createElement("pre"); d.textContent = out.join("\n"); d.style.cssText = "position:fixed;left:0;right:0;bottom:0;background:#111;color:#eee;padding:12px;font:12px ui-monospace,monospace;z-index:99999;max-height:40vh;overflow:auto;white-space:pre-wrap"; document.body.appendChild(d); }
  return out;
};
window.addEventListener("error", function () { window.__bootError = true; });
</script>
<style id="app-theme">
  /* canteen-lan - its own palette, type and shape.
     Keyed on data-theme so the in-app theme toggle still works; !important is
     required because web-kit sets these as inline styles on <html>. */
  html[data-theme="dark"]{--bg:#150c0a !important;--card:#25110a !important;--ink:#fef3ee !important;--mut:#b67860 !important;--line:#3c1a0a !important;--acc:#f08750 !important;}
  html[data-theme="light"]{--bg:#fef7f4 !important;--card:#ffffff !important;--ink:#261815 !important;--mut:#b85c30 !important;--line:#fce8dd !important;--acc:#c0480a !important;}
  html,body{font-family:"SF Pro Rounded", ui-rounded, "Nunito", system-ui, sans-serif !important;letter-spacing:0 !important;
    background-image:radial-gradient(820px 360px at 50% -170px,
      color-mix(in srgb, var(--acc) 16%, transparent), transparent 72%) !important;
    background-repeat:no-repeat !important;background-attachment:fixed !important}
  button,input,textarea,select{font-family:"SF Pro Rounded", ui-rounded, "Nunito", system-ui, sans-serif !important}
  button,.btn{border-radius:18px !important}
  input,textarea,select{border-radius:16px !important}
  .card,[class*="card"]{border-radius:20px !important}
  button.primary{background:var(--acc) !important}
  #printArea{display:none}
  /* the A4 sheet the accounts get: a page, not a docket */
  #printArea .a4{font:12px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000}
  #printArea .a4 h1{font-size:19px;margin:0 0 2px;letter-spacing:-.01em}
  #printArea .a4 .meta{color:#555;font-size:11.5px;margin-bottom:12px}
  #printArea .a4 .figs{display:flex;flex-wrap:wrap;gap:22px;margin:12px 0 4px}
  #printArea .a4 .fig b{display:block;font-size:19px;line-height:1.1}
  #printArea .a4 .fig span{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#555}
  #printArea .a4 h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#555;margin:16px 0 4px}
  #printArea .a4 table{width:100%;border-collapse:collapse}
  #printArea .a4 th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#555;
       text-align:left;border-bottom:1px solid #999;padding:4px 6px}
  #printArea .a4 td{border-bottom:1px solid #ddd;padding:4px 6px;font-size:12px}
  #printArea .a4 td.n,#printArea .a4 th.n{text-align:right;font-variant-numeric:tabular-nums}
  @page{size:A4;margin:16mm}
  #printArea{background:#fff;color:#000}
  #printArea .a3{font:17px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#000}
  #printArea .a3 h1{font-size:40px;margin:0 0 2px;letter-spacing:-.02em}
  #printArea .a3 .meta{color:#555;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}
  #printArea .a3 h2{font-size:12.5px;letter-spacing:.18em;text-transform:uppercase;color:#555;
       border-bottom:1px solid #999;padding-bottom:4px;margin:20px 0 8px}
  #printArea .a3 .cols{columns:2;column-gap:14mm}
  #printArea .a3 .dish{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px;break-inside:avoid;
       padding:5px 0;font-size:17px}
  #printArea .a3 .dish .nm{font-weight:600}
  #printArea .a3 .dish .dots{flex:1;border-bottom:1px dotted #999;height:1em;min-width:12px}
  #printArea .a3 .dish .pr{font-variant-numeric:tabular-nums;font-weight:600}
  #printArea .a3 .dish .sub{flex:0 0 100%;color:#555;font-size:12.5px;margin:-3px 0 0}
  @media print{
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important}
  }
</style>
